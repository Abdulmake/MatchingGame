<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة المطابقة</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Tahoma,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 20% 10%,#244b7a 0,transparent 35%),
        radial-gradient(circle at 90% 90%,#39235e 0,transparent 35%),
        linear-gradient(135deg,#07111f,#111b31 55%,#171126);
}

header{
    text-align:center;
    padding:22px 12px 10px;
}

.logo{
    font-size:42px;
    margin-bottom:3px;
}

h1{
    margin:0;
    font-size:28px;
}

.subtitle{
    margin:7px 0 15px;
    color:#aebbd0;
    font-size:14px;
}

.stats{
    width:min(96%,700px);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;
    padding:10px 5px;
    backdrop-filter:blur(10px);
}

.stat small{
    display:block;
    color:#aebbd0;
    font-size:12px;
    margin-bottom:4px;
}

.stat b{
    font-size:19px;
}

#message{
    text-align:center;
    min-height:25px;
    margin:12px;
    color:#dce8ff;
    font-size:15px;
}

#game{
    width:min(94vw,700px);
    margin:12px auto;
    display:grid;
    gap:9px;
}

.card{
    position:relative;
    aspect-ratio:1;
    border:0;
    border-radius:17px;
    cursor:pointer;
    font-size:clamp(25px,7vw,52px);
    color:white;
    background:linear-gradient(145deg,#203c63,#152a49);
    box-shadow:
        0 7px 18px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.1);
    transition:.2s;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.08);
}

.card:hover{
    transform:translateY(-2px) scale(1.02);
}

.card:active{
    transform:scale(.95);
}

.card.flipped{
    background:linear-gradient(145deg,#ffffff,#dce7f5);
    color:#111;
    transform:rotateY(0deg);
}

.card.matched{
    background:linear-gradient(145deg,#35d39a,#168c72);
    color:white;
    transform:scale(.88);
    opacity:.65;
    pointer-events:none;
}

.controls{
    width:min(96%,700px);
    margin:18px auto 30px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.control{
    border:0;
    border-radius:15px;
    padding:13px 5px;
    color:white;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.08);
    font-size:14px;
    cursor:pointer;
}

.control:hover{
    background:rgba(255,255,255,.15);
}

.control:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(2,6,15,.82);
    backdrop-filter:blur(8px);
    z-index:50;
    padding:20px;
}

.box{
    width:min(94vw,430px);
    text-align:center;
    padding:30px 22px;
    border-radius:25px;
    background:linear-gradient(145deg,#172943,#101a2d);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.box .emoji{
    font-size:55px;
}

.box h2{
    margin:10px 0;
    font-size:30px;
}

.box p{
    line-height:1.9;
    color:#ccd7e8;
}

.box button{
    border:0;
    border-radius:14px;
    padding:13px 22px;
    margin:5px;
    color:white;
    background:#356fc2;
    font-size:16px;
    cursor:pointer;
}

.good{
    color:#62e6aa;
}

.bad{
    color:#ff7c8c;
}

@media(max-width:450px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    #game{
        gap:6px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🧠</div>
    <h1>لعبة المطابقة</h1>
    <div class="subtitle">طابق جميع البطاقات وارفع نقاطك!</div>

    <div class="stats">
        <div class="stat">
            <small>🏆 المرحلة</small>
            <b id="level">1</b>
        </div>

        <div class="stat">
            <small>⏱️ الوقت</small>
            <b id="time">60</b>
        </div>

        <div class="stat">
            <small>⭐ النقاط</small>
            <b id="score">0</b>
        </div>

        <div class="stat">
            <small>🎯 المحاولات</small>
            <b id="moves">0</b>
        </div>
    </div>
</header>

<div id="message"></div>

<div id="game"></div>

<div class="controls">
    <button class="control" id="hintBtn">
        🔍 كشف زوج <b id="hintCount">1</b>
    </button>

    <button class="control" id="peekBtn">
        👁️ كشف الكل <b id="peekCount">1</b>
    </button>

    <button class="control" id="timeBtn">
        ⏱️ +20 ثانية <b id="timeCount">1</b>
    </button>
</div>

<!-- شاشة الفوز -->
<div class="overlay" id="winScreen">
    <div class="box">
        <div class="emoji">🎉</div>
        <h2 class="good">أحسنت!</h2>
        <p id="winText"></p>

        <button onclick="nextLevel()">
            ➡️ المرحلة التالية
        </button>
    </div>
</div>

<!-- شاشة الخسارة -->
<div class="overlay" id="loseScreen">
    <div class="box">
        <div class="emoji">⏰</div>
        <h2 class="bad">انتهى الوقت</h2>
        <p id="loseText"></p>

        <button onclick="restartLevel()">
            🔄 إعادة المحاولة
        </button>
    </div>
</div>

<script>

/* =========================
   الرموز
========================= */

const symbols = [
    "🐶","🐱","🦁","🐯","🐸","🐼","🐵","🦊",
    "🐰","🐨","🐷","🐮","🐔","🐧","🐦","🦄",
    "🐝","🦋","🐢","🐙","🦀","🐳","🐬","🐠",
    "🍎","🍉","🍓","🍌","🍕","🍔","🍩","🍪",
    "⚽","🏀","🏆","🚗","🚀","⭐","🌈","🔥",
    "💎","🎈","🎁","🎮","👑","☀️","🌙","❤️"
];


/* =========================
   المتغيرات
========================= */

let level = 1;
let score = 0;
let moves = 0;
let timeLeft = 60;

let firstCard = null;
let secondCard = null;

let lockBoard = false;
let matchedPairs = 0;
let totalPairs = 0;

let timer = null;

let hints = 1;
let peeks = 1;
let extraTimes = 1;


/* =========================
   صعوبة المرحلة
========================= */

function getDifficulty(){

    if(level % 10 === 0){

        return {
            pairs:20,
            time:90,
            name:"💀 مرحلة أسطورية"
        };

    }

    if(level % 5 === 0){

        return {
            pairs:15,
            time:70,
            name:"🔥 مرحلة صعبة"
        };

    }

    return {

        pairs:Math.min(
            4 + Math.floor(level / 2),
            18
        ),

        time:Math.max(
            35,
            65 - level
        ),

        name:"⭐ مرحلة عادية"
    };
}


/* =========================
   بدء المرحلة
========================= */

function startLevel(){

    clearInterval(timer);

    const difficulty = getDifficulty();

    matchedPairs = 0;
    moves = 0;

    firstCard = null;
    secondCard = null;

    lockBoard = false;

    totalPairs = difficulty.pairs;
    timeLeft = difficulty.time;

    document.getElementById("level").textContent = level;
    document.getElementById("time").textContent = timeLeft;
    document.getElementById("score").textContent = score;
    document.getElementById("moves").textContent = moves;

    document.getElementById("message").textContent =
        difficulty.name + " — طابق جميع البطاقات!";

    createBoard();

    updateButtons();

    timer = setInterval(function(){

        timeLeft--;

        document.getElementById("time").textContent =
            timeLeft;

        if(timeLeft <= 0){

            clearInterval(timer);

            loseGame();
        }

    },1000);
}


/* =========================
   إنشاء اللوحة
========================= */

function createBoard(){

    const game = document.getElementById("game");

    game.innerHTML = "";

    let selected =
        symbols.slice(0,totalPairs);

    let cards =
        [...selected,...selected];

    cards.sort(function(){

        return Math.random() - .5;

    });

    let columns = 4;

    if(cards.length >= 20)
        columns = 5;

    if(cards.length >= 30)
        columns = 6;

    game.style.gridTemplateColumns =
        `repeat(${columns},1fr)`;


    cards.forEach(function(symbol){

        const card =
            document.createElement("button");

        card.className = "card";

        card.dataset.symbol = symbol;

        card.textContent = "❓";

        card.addEventListener(
            "click",
            function(){

                flipCard(card);

            }
        );

        game.appendChild(card);

    });
}


/* =========================
   قلب البطاقة
========================= */

function flipCard(card){

    if(
        lockBoard ||
        card.classList.contains("flipped") ||
        card.classList.contains("matched")
    ){
        return;
    }

    card.classList.add("flipped");

    card.textContent =
        card.dataset.symbol;


    if(!firstCard){

        firstCard = card;

        return;
    }


    secondCard = card;

    moves++;

    document.getElementById("moves")
        .textContent = moves;

    checkMatch();
}


/* =========================
   فحص التطابق
========================= */

function checkMatch(){

    lockBoard = true;

    if(
        firstCard.dataset.symbol ===
        secondCard.dataset.symbol
    ){

        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        matchedPairs++;

        score +=
            10 + Math.max(0,timeLeft);

        document.getElementById("score")
            .textContent = score;

        resetTurn();


        if(matchedPairs === totalPairs){

            winGame();
        }

    }else{

        setTimeout(function(){

            if(firstCard){

                firstCard.classList.remove(
                    "flipped"
                );

                firstCard.textContent = "❓";
            }

            if(secondCard){

                secondCard.classList.remove(
                    "flipped"
                );

                secondCard.textContent = "❓";
            }

            resetTurn();

        },650);
    }
}


/* =========================
   إعادة الدور
========================= */

function resetTurn(){

    firstCard = null;
    secondCard = null;

    lockBoard = false;
}


/* =========================
   الفوز
========================= */

function winGame(){

    clearInterval(timer);

    saveGame();

    document.getElementById("winText")
        .innerHTML =

        `
        أنهيت المرحلة <b>${level}</b> بنجاح!<br><br>
        ⭐ النقاط: <b>${score}</b><br>
        🎯 المحاولات: <b>${moves}</b><br>
        ⏱️ الوقت المتبقي: <b>${timeLeft}</b>
        `;

    document.getElementById("winScreen")
        .style.display = "flex";
}


/* =========================
   المرحلة التالية
========================= */

function nextLevel(){

    document.getElementById("winScreen")
        .style.display = "none";

    level++;

    if(level % 10 === 0){

        hints++;
        peeks++;
        extraTimes++;

        alert(
            "🎁 مكافأة!\n" +
            "حصلت على مساعدة إضافية من كل نوع."
        );
    }

    saveGame();

    startLevel();
}


/* =========================
   الخسارة
========================= */

function loseGame(){

    lockBoard = true;

    document.getElementById("loseText")
        .innerHTML =

        `
        وصلت إلى المرحلة <b>${level}</b>.<br><br>
        ⭐ النقاط: <b>${score}</b><br><br>
        حاول مرة أخرى لتحطيم رقمك!
        `;

    document.getElementById("loseScreen")
        .style.display = "flex";
}


/* =========================
   إعادة المرحلة
========================= */

function restartLevel(){

    document.getElementById("loseScreen")
        .style.display = "none";

    startLevel();
}


/* =========================
   المساعدة: كشف زوج
========================= */

document.getElementById("hintBtn")
.addEventListener("click",function(){

    if(hints <= 0 || lockBoard)
        return;

    const cards = [
        ...document.querySelectorAll(
            ".card:not(.matched)"
        )
    ];

    let groups = {};

    cards.forEach(function(card){

        let symbol =
            card.dataset.symbol;

        if(!groups[symbol])
            groups[symbol] = [];

        groups[symbol].push(card);

    });


    let pair =
        Object.values(groups)
        .find(function(group){

            return group.length >= 2;

        });


    if(!pair)
        return;

    hints--;

    pair[0].classList.add("flipped");
    pair[1].classList.add("flipped");

    pair[0].textContent =
        pair[0].dataset.symbol;

    pair[1].textContent =
        pair[1].dataset.symbol;


    setTimeout(function(){

        pair.forEach(function(card){

            if(!card.classList.contains("matched")){

                card.classList.remove("flipped");

                card.textContent = "❓";
            }

        });

    },1200);

    updateButtons();

});


/* =========================
   كشف جميع البطاقات
========================= */

document.getElementById("peekBtn")
.addEventListener("click",function(){

    if(peeks <= 0 || lockBoard)
        return;

    peeks--;

    const cards = [
        ...document.querySelectorAll(
            ".card:not(.matched)"
        )
    ];

    cards.forEach(function(card){

        card.classList.add("flipped");

        card.textContent =
            card.dataset.symbol;

    });


    setTimeout(function(){

        cards.forEach(function(card){

            if(!card.classList.contains("matched")){

                card.classList.remove("flipped");

                card.textContent = "❓";
            }

        });

    },1500);

    updateButtons();

});


/* =========================
   إضافة الوقت
========================= */

document.getElementById("timeBtn")
.addEventListener("click",function(){

    if(extraTimes <= 0)
        return;

    extraTimes--;

    timeLeft += 20;

    document.getElementById("time")
        .textContent = timeLeft;

    document.getElementById("message")
        .textContent =
        "⏱️ تمت إضافة 20 ثانية!";

    updateButtons();

});


/* =========================
   تحديث الأزرار
========================= */

function updateButtons(){

    document.getElementById("hintCount")
        .textContent = hints;

    document.getElementById("peekCount")
        .textContent = peeks;

    document.getElementById("timeCount")
        .textContent = extraTimes;


    document.getElementById("hintBtn")
        .disabled = hints <= 0;

    document.getElementById("peekBtn")
        .disabled = peeks <= 0;

    document.getElementById("timeBtn")
        .disabled = extraTimes <= 0;
}


/* =========================
   حفظ اللعبة
========================= */

function saveGame(){

    const data = {

        level:level,
        score:score,

        hints:hints,
        peeks:peeks,
        extraTimes:extraTimes

    };

    localStorage.setItem(
        "matchingGameSave",
        JSON.stringify(data)
    );
}


/* =========================
   تحميل الحفظ
========================= */

function loadGame(){

    const saved =
        localStorage.getItem(
            "matchingGameSave"
        );


    if(!saved){

        startLevel();

        return;
    }


    try{

        const data =
            JSON.parse(saved);

        level =
            data.level || 1;

        score =
            data.score || 0;

        hints =
            data.hints ?? 1;

        peeks =
            data.peeks ?? 1;

        extraTimes =
            data.extraTimes ?? 1;

        startLevel();

    }catch(error){

        startLevel();
    }
}


/* =========================
   حفظ تلقائي
========================= */

setInterval(
    saveGame,
    5000
);


/* =========================
   تشغيل اللعبة
========================= */

loadGame();

</script>

</body>
</html>
